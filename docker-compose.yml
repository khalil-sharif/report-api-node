version: '3.9'

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: sh -c "npx prisma migrate deploy && node dist/src/main.js"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/reports?schema=public
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    ports:
      - '3000:3000'
    depends_on:
      - postgres
      - redis
      - minio
      - mailhog

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: node dist/src/worker.js
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/reports?schema=public
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    depends_on:
      - postgres
      - redis
      - minio
      - mailhog

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: reports
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  pgdata:
  miniodata:
